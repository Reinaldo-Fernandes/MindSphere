<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MindSphere - Ecossistema de Foco</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="mobile.css" media="screen and (max-width: 768px)">
    <link rel="icon" href="/components/orbits/Orbit.png" type="image/png">
</head>

<body class="onboarding-active">
    <div class="background-overlay"></div>
    
    <header class="interface-element">
        <div class="header-left">
            <button id="panic-btn" class="glass-btn panic">RESET</button>
            <button id="auth-trigger" class="glass-btn">🔑 ENTRAR / REGISTAR</button>
            <button id="view-metrics" class="glass-btn" style="display: none; border-color: #00ff41; color: #00ff41;">
                <i class="fas fa-terminal"></i> PAINEL ADM
            </button>
        </div>
        <h1 class="logo">MindSphere</h1>
        <div class="header-right" style="display: flex; gap: 10px; align-items: center;">
            <select id="garden-style" class="glass-select">
                <option value="plantas">🌿 Jardim</option>
                <option value="espaco">✨ Galáxia</option>
                <option value="notas">🎵 Musical</option>
                <option value="comida">☕ Café</option>
            </select>
            <button id="agenda-trigger" class="glass-btn circle-btn"><i class="fas fa-calendar-day"></i></button>
            <button id="game-trigger" class="glass-btn circle-btn" title="Relaxar"><i class="fas fa-gamepad"></i></button>
        </div>
    </header>

    <main class="container">
        <aside class="side-panel left interface-element">
            <h3 class="panel-title">Lentes</h3>
            <button class="mode-btn" onclick="setMode('dopamina')">✨ Dopamina</button>
            <button class="mode-btn" onclick="setMode('serenidade')">🌊 Serenidade</button>
            <button class="mode-btn" onclick="setMode('autonomia')">🦾 Autonomia</button>
        </aside>

        <div class="sphere-wrapper">
            <div id="plants-display"></div> 
            <div class="orbit-path orbit-1"></div>
            <div class="orbit-path orbit-2"></div>
            <div class="sphere-outer">
                <div class="sphere-content">
                    <div id="status-text">Pronto?</div>
                    <div id="timer-display">25:00</div>
                    <div class="brain-icon">🧠</div>
                </div>
                <svg class="progress-ring" viewBox="0 0 500 500">
                    <circle class="progress-ring__circle" stroke="var(--accent-cyan)" stroke-width="8" fill="transparent" r="212" cx="250" cy="250"/>
                </svg>
            </div>
        </div>

        <aside class="side-panel right interface-element">
            <h3 class="panel-title">Goblin Mode 👹</h3>
            <div class="task-input-group">
                <input type="text" id="task-input" placeholder="O que é difícil?">
                <div class="goblin-controls" style="display: flex; gap: 10px;">
                    <button id="break-task-btn">Split</button>
                    <button id="clear-tasks-btn" class="glass-btn" style="padding: 5px 10px; font-size: 0.6rem;">Limpar</button>
                </div>
            </div>
            <div id="subtasks-list"></div>
        </aside>
    </main>

    <footer class="mixer interface-element">
        <div class="sound-control">
            <span>🌧️</span> 
            <input type="range" id="rain-vol" min="0" max="1" step="0.1" value="0">
        </div>
        <div id="mixer-anchor"></div>
        <div class="sound-control">
            <span>🔥</span> 
            <input type="range" id="fire-vol" min="0" max="1" step="0.1" value="0">
        </div>
    </footer>

    <div id="game-overlay" class="modal-vitral" style="display: none;">
        <div class="auth-card game-card">
            <button id="close-game" class="close-modal">×</button>
            <h2 class="panel-title">Stellar Flow</h2>
            <div class="game-container" style="position: relative; background: rgba(0,0,0,0.5); border-radius: 15px; width: 300px; height: 300px; margin: 0 auto;">
                <canvas id="gameCanvas" width="300" height="300"></canvas>
                <div id="game-tap-to-start" class="tap-overlay" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); color: cyan; cursor: pointer;">
                    TOQUE PARA COMEÇAR
                </div>
            </div>
            <div id="scoreDisplay" style="text-align: center; margin-top: 10px;">Foco: 0</div>
        </div>
    </div>

    <div id="agenda-modal" class="modal-vitral" style="display: none;">
        <div class="auth-card agenda-card">
            <button class="close-modal">×</button>
            <h2 class="panel-title">📅 Agenda Diária</h2>
            <input type="date" id="agenda-date" class="glass-input">
            <textarea id="agenda-notes" class="glass-input" placeholder="O que temos para hoje?" rows="8"></textarea>
            <button id="save-agenda" class="glass-btn start" style="width: 100%;">GUARDAR MEMÓRIA</button>
        </div>
    </div>

    <div id="profile-modal" class="modal-vitral" style="display: none;">
        <div class="profile-card profile-main-card">
            <button class="close-modal">×</button>
            <div class="profile-header-static" style="text-align: center;">
                <span id="user-level-badge" class="xp-number">Nível 1</span>
                <h2 id="user-display-name">Viajante</h2>
                <div class="xp-bar-container"><div id="xp-bar-fill" style="width: 0%"></div></div>
                <small id="xp-text">0 / 1000 XP</small>
            </div>
            <div class="profile-scroll-area">
                <section class="profile-section">
                    <h3>🏆 Galeria de Prêmios</h3>
                    <div class="trophy-grid" id="trophy-shelf-content"></div>
                </section>
            </div>
            <button id="logout-btn" class="glass-btn" style="width: 100%;">SAIR DA CONTA</button>
        </div>
    </div>

    <div id="orbit-assistant" class="orbit-container">
        <div class="orbit-bubble" id="orbit-speech"></div>
        <div class="orbit-character">
            <img src="./components/orbits/orbit.png" alt="Orbit" id="orbit-img" style="cursor: pointer;">
        </div>
        <div id="start-btn-container">
            <button id="start-btn" class="glass-btn">INICIAR</button>
        </div>
    </div>

    <div hidden>
        <audio id="audio-rain" loop src="sons/chuva.mp3"></audio>
        <audio id="audio-fire" loop src="sons/fire.mp3"></audio>
        <audio id="audio-start" src="sons/start.mp3"></audio>
        <audio id="audio-complete" src="sons/complete.mp3"></audio>
    </div>

    <script src="orbit.js" defer></script>
    <script type="module" src="firebase.js"></script>
    <script type="module" src="gameficacao.js"></script>
    <script type="module" src="script.js"></script>
    <script src="stellar-flow.js"></script>
</body>
</html>
