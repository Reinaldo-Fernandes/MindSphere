<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MindSphere - Ecossistema Neurodivergente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="onboarding-active">
    <div class="background-overlay"></div>
    
    <header class="interface-element">
        <div class="header-left">
            <button id="panic-btn" class="glass-btn panic">RESET</button>
            <button id="auth-trigger" class="glass-btn">🔑 ENTRAR / REGISTAR</button>
        </div>
        <h1 class="logo">MindSphere</h1>
        <select id="garden-style" class="glass-select">
            <option value="plantas">🌿 Jardim</option>
            <option value="espaco">✨ Galáxia</option>
            <option value="notas">🎵 Musical</option>
            <option value="comida">☕ Café</option>
        </select>
    </header>

    <div id="auth-modal" class="modal-vitral">
        <div class="auth-card">
            <button class="close-modal">×</button>
            <h2 class="panel-title">Explorador MindSphere</h2>
            <p style="font-size: 0.8rem; opacity: 0.7; margin-bottom: 20px;">Salve seu progresso e colecione prêmios.</p>
            <form id="auth-form">
                <input type="email" id="login-email" placeholder="Seu E-mail" class="glass-input" required>
                <input type="password" id="login-pass" placeholder="Sinal de Acesso" class="glass-input" required>
                <button type="submit" class="glass-btn start" style="width: 100%;">CONECTAR</button>
            </form>
            <p style="font-size: 0.7rem; margin-top: 15px;">Novo aqui? <span id="go-to-register" style="color: var(--accent-cyan); cursor: pointer; font-weight: bold;">Crie seu perfil</span></p>
        </div>
    </div>

    <div id="register-modal" class="modal-vitral">
        <div class="auth-card">
            <button class="close-modal">×</button>
            <h2 class="panel-title">Novo Explorador</h2>
            <p style="font-size: 0.8rem; opacity: 0.7; margin-bottom: 20px;">Comece sua jornada de foco personalizado.</p>
            
            <form id="register-form">
                <input type="text" id="reg-nome" placeholder="Nome ou Nickname" class="glass-input" required>
                <input type="email" id="reg-email" placeholder="E-mail" class="glass-input" required>
                <input type="number" id="reg-idade" placeholder="Idade" class="glass-input" required>
                
                <select id="reg-neuro" class="glass-select" style="width: 100%; margin-bottom: 15px; padding: 12px;">
                    <option value="" disabled selected>Perfil Cognitivo (Opcional)</option>
                    <option value="tdah">TDAH</option>
                    <option value="autismo">Autista</option>
                    <option value="neurotipico">Neurotípico</option>
                    <option value="outro">Outro</option>
                </select>

                <button type="submit" class="glass-btn start" style="width: 100%;">CRIAR PERFIL</button>
            </form>
            <p style="font-size: 0.7rem; margin-top: 15px;">Já tem conta? <span id="go-to-login" style="color: var(--accent-pink); cursor: pointer; font-weight: bold;">Fazer Login</span></p>
        </div>
    </div>

    <div id="shelf-modal" class="modal-vitral">
        <div class="shelf-card">
            <button class="close-modal">×</button>
            <h2 class="panel-title">Sua Coleção Vitral</h2>
            <div class="trophy-grid" id="trophy-display"></div>
        </div>
    </div>

    <main class="container">
        <aside class="side-panel left interface-element">
            <h3 class="panel-title">Lentes</h3>
            <button class="mode-btn" onclick="setMode('dopamina')">✨ Dopamina</button>
            <button class="mode-btn" onclick="setMode('serenidade')">🌊 Serenidade</button>
            <button class="mode-btn" onclick="setMode('autonomia')">🦾 Autonomia</button>
        </aside>

        <div class="sphere-wrapper">
            <div id="orbit-1" class="orbit-path orbit-1"></div>
            <div id="orbit-2" class="orbit-path orbit-2"></div>
            
            <div class="sphere-outer">
                <div class="sphere-content">
                    <div id="status-text">Pronto?</div>
                    <div id="timer-display">25:00</div>
                    <div class="brain-icon">🧠</div>
                </div>
                <svg class="progress-ring" viewBox="0 0 500 500">
                    <circle class="progress-ring__circle" stroke="var(--accent-cyan)" stroke-width="8" fill="transparent" r="212" cx="250" cy="250"/>
                </svg>
            </div>

            <div id="orbit-assistant" class="orbit-container">
                <div class="orbit-bubble" id="orbit-speech"></div>
                <div class="orbit-character">
                    <img src="./assistente/orbits/Orbit.png" alt="Orbit" id="orbit-img">
                </div>
                <div id="start-btn-container">
                    <button id="start-btn" class="glass-btn start">INICIAR FOCO</button>
                </div>
            </div>
        </div>

        <aside class="side-panel right interface-element">
            <h3 class="panel-title">Goblin Mode 👹</h3>
            <div class="task-input-group">
                <input type="text" id="task-input" placeholder="O que é difícil?">
                <button id="break-task-btn">Split</button>
            </div>
            <div id="subtasks-list"></div>
        </aside>
    </main>

    <footer class="mixer interface-element">
        <div class="sound-control">
            <span>🌧️</span> 
            <input type="range" id="rain-vol" min="0" max="1" step="0.1" value="0">
        </div>
        <div id="mixer-anchor"></div>
        <div class="sound-control">
            <span>🔥</span> 
            <input type="range" id="fire-vol" min="0" max="1" step="0.1" value="0">
        </div>
    </footer>
    

   <div hidden>
        <audio id="audio-rain" loop src="./sons/rain.mp3"></audio>
        <audio id="audio-fire" loop src="./sons/fire.mp3"></audio>
        <audio id="audio-start" src="./sons/start.mp3"></audio>
        <audio id="audio-complete" src="./sons/complete.mp3"></audio>
    </div>

    <script src="script.js">
        
    </script>
</body>
</html>
